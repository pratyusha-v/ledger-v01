<style>
body{margin:0}
a{color:#2E2430}a:hover{color:#2E2430}
.card{background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;min-width:0}
.sh{margin:0;font-size:15px;font-weight:600;color:#2E2430;padding-bottom:10px;border-bottom:1px solid #E6E2DE}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:0}
.kv > div,.kv > label{display:flex;flex-direction:column;gap:4px;min-width:0}
.lb{font-size:11.5px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:#666664}
.ro{font-size:14px;color:#2E2430;height:34px;display:flex;align-items:center}
.in{box-sizing:border-box;width:100%;height:34px;border:1px solid #7C7C7A;border-radius:4px;padding:0 10px;font:400 14px 'Lato',sans-serif;background:#FFFFFF;color:#2E2430}
.in:focus,.ta:focus{outline:2px solid #7C7C7A;outline-offset:-1px}
.in:disabled{background:#EFE9F0;color:#666664;border-style:dashed;font-style:italic}
.ta{box-sizing:border-box;width:100%;border:1px solid #7C7C7A;border-radius:4px;padding:8px 10px;font:400 14px/1.45 'Lato',sans-serif;background:#FFFFFF;color:#2E2430;resize:vertical}
.ta::placeholder,.in::placeholder{color:#666664;font-style:italic}
.suf{position:relative;display:block}
.suf span{position:absolute;right:10px;top:8px;font-size:13px;color:#666664;pointer-events:none}
.stat{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid #E6E2DE;border-radius:8px;background:#FAF7F4}
.stat b{font-size:26px;font-weight:600;color:#2E2430;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:#666664}
.dico{position:absolute;right:10px;top:9px;pointer-events:none;color:#666664}
.tt{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px;color:#2E2430}
.tt th,.tt td{border-bottom:1px solid #E6E2DE;padding:0 14px;background:#FFFFFF;text-align:left;white-space:nowrap;height:46px}
.tt thead th{background:#FAF7F4;border-bottom:2px solid #7C7C7A;height:40px;font-size:13px;font-weight:600}
.tt tbody th{font-weight:500}
.tt .num{text-align:right}
.tt .ctr{text-align:center}
.mk{width:72px;height:32px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.ck{width:18px;height:18px;margin:0;cursor:pointer}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid #7C7C7A;color:#2E2430;background:#FAF7F4;margin-left:8px}
.abt{font-style:italic;color:#666664;font-size:12.5px}
.nv{position:relative;display:flex;align-items:stretch}
.dd{display:none;position:absolute;top:100%;left:0;min-width:230px;background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.10);padding:6px;z-index:60;flex-direction:column;gap:2px}
.nv:hover .dd,.nv:focus-within .dd,.nv.open .dd{display:flex}
.dd a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;font-size:13.5px;font-weight:400;color:#2E2430;text-decoration:none;border-radius:4px}
.dd a:hover{background:#EFE9F0}
.dd a small{font-size:11.5px;color:#666664}
.dd .who{padding:8px 10px 10px;border-bottom:1px solid #E6E2DE;margin-bottom:4px;font-size:12.5px;color:#666664}
.dd .who b{display:block;font-size:13.5px;color:#2E2430}
</style>

<body>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      f: { name: 'Test 01', date: '10/07/2025', max: '25', weight: '5', syllabus: '', notes: '' },
      marks: { mahima: '23', bhavya: '21', divya: '18', sneha: '15', lakshmi: '' },
      absent: { lakshmi: true }
    };
  }
  setField(key) {
    return (e) => { const v = e.target.value; this.setState((st) => ({ f: { ...st.f, [key]: v } })); };
  }
  renderVals() {
    const st = this.state;
    const students = [
      { id: 'mahima', name: 'Mahima C.' },
      { id: 'bhavya', name: 'Bhavya S.' },
      { id: 'divya', name: 'Divya Sri P.' },
      { id: 'sneha', name: 'Sneha Varma' },
      { id: 'lakshmi', name: 'Lakshmi Hansika K.' }
    ];
    const max = parseFloat(st.f.max) || 0;
    const rows = students.map((s) => {
      const absent = !!st.absent[s.id];
      const val = absent ? 'Ab' : st.marks[s.id];
      const n = parseFloat(val);
      const num = (absent || isNaN(n)) ? 0 : n;
      return {
        ...s, absent, val, num,
        pct: absent ? 'Ab' : (max ? (num / max * 100).toFixed(1) + '%' : '—'),
        toggle: () => this.setState((p) => ({ absent: { ...p.absent, [s.id]: !p.absent[s.id] } })),
        change: (e) => { const v = e.target.value; this.setState((p) => ({ marks: { ...p.marks, [s.id]: v } })); }
      };
    });
    const present = rows.filter((r) => !r.absent);
    const nums = (present.length ? present : rows).map((r) => r.num);
    const hi = Math.max(...nums), lo = Math.min(...nums);
    const hiRow = present.find((r) => r.num === hi), loRow = present.find((r) => r.num === lo);
    const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
    const passMark = Math.round(max * 0.35);
    const passed = rows.filter((r) => !r.absent && r.num >= passMark).length;
    const absentCount = rows.filter((r) => r.absent).length;
    const fmt = (x) => (Math.round(x * 10) / 10).toString();
    rows.forEach((r) => { r.isHigh = r === hiRow; r.isLow = r === loRow; });
    return {
      f: st.f,
      r0: rows[0], r1: rows[1], r2: rows[2], r3: rows[3], r4: rows[4],
      s: {
        avg: fmt(avg),
        avgPct: max ? fmt(avg / max * 100) + '%' : '—',
        high: fmt(hi), highName: hiRow ? hiRow.name : '—',
        low: fmt(lo), lowName: loRow ? loRow.name : '—',
        passPct: Math.round(passed / rows.length * 100) + '%',
        passText: passed + ' of ' + rows.length + ' passed (pass mark ' + passMark + ' / ' + (st.f.max || '—') + ')',
        wroteText: (rows.length - absentCount) + ' of ' + rows.length,
        absent: absentCount
      },
      onName: this.setField('name'), onDate: this.setField('date'), onMax: this.setField('max'),
      onWeight: this.setField('weight'), onSyllabus: this.setField('syllabus'), onNotes: this.setField('notes')
    };
  }
}
Ledger.mount(Component, Ledger.propsFrom({"$preview": {"width": 1512, "height": 982}}));
</script>
</body>
</html>
