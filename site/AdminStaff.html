<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Admin – Staff Directory</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E2430}a:hover{color:#2E2430}
.card{background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;min-width:0}
.sh{margin:0;font-size:15px;font-weight:600;color:#2E2430;padding-bottom:10px;border-bottom:1px solid #E6E2DE;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sh small{font-size:12.5px;font-weight:400;color:#666664}
.tt{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px;color:#2E2430}
.tt th,.tt td{border-bottom:1px solid #E6E2DE;padding:0 14px;background:#FFFFFF;text-align:left;white-space:nowrap;height:50px}
.tt thead th{background:#FAF7F4;border-bottom:2px solid #7C7C7A;height:42px;font-size:13px;font-weight:600}
.tt tbody th{font-weight:500}
.tt .num{text-align:right}
.tbx{border:1px solid #E6E2DE;background:#FFFFFF;border-radius:8px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;box-sizing:border-box;border:1.5px solid #7C7C7A;border-radius:8px;background:#FFFFFF;color:#2E2430;font:500 14px 'Lato',sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:#FAF7F4;color:#2E2430}
.btn.p{background:#FF911E;border-color:#FF911E;color:#2E2430}
.btn.p:hover{background:#FF911E;color:#2E2430}
.btn.s{height:32px;padding:0 12px;font-size:13px}
.btn.ghost{border-color:#E6E2DE;color:#666664;cursor:not-allowed}
.fl{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:#666664;min-width:0}
.in{box-sizing:border-box;width:100%;height:38px;border:1px solid #7C7C7A;border-radius:4px;padding:0 10px;font:400 14px 'Lato',sans-serif;background:#FFFFFF;color:#2E2430;text-transform:none;letter-spacing:0}
.in::placeholder,.ta::placeholder{color:#666664;font-style:italic}
.in:focus,.ta:focus{outline:2px solid #7C7C7A;outline-offset:-1px}
.ta{box-sizing:border-box;width:100%;border:1px solid #7C7C7A;border-radius:4px;padding:8px 10px;font:400 14px/1.45 'Lato',sans-serif;background:#FFFFFF;color:#2E2430;resize:vertical;text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px}
.tabs{display:flex;gap:24px;border-bottom:1px solid #E6E2DE}
.tab{display:flex;align-items:center;gap:6px;padding:0 4px;height:38px;font-size:14px;text-decoration:none;border-bottom:3px solid transparent;color:#666664}
.tab.on{color:#2E2430;font-weight:600;border-bottom-color:#6E5A70}
.tab span{font-size:12px;color:#666664;background:#EFE9F0;border-radius:9px;padding:0 7px;font-weight:500}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:4px;border:1px solid #7C7C7A;color:#2E2430;background:#FAF7F4;white-space:nowrap}
.tag.dk{background:#2E2430;color:#FFFFFF;border-color:#7C7C7A}
.tag.dash{border-style:dashed;color:#666664;background:#FFFFFF}
.stat{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid #E6E2DE;border-radius:8px;background:#FFFFFF;min-width:0}
.stat b{font-size:26px;font-weight:600;color:#2E2430;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:#666664}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:0}
.kv div{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv dt{font-size:11.5px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:#666664}
.kv dd{margin:0;font-size:14px;color:#2E2430}
.ph{color:#666664;font-style:italic}
.sk{display:inline-block;height:10px;background:#EFE9F0;border-radius:4px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:1.5px dashed #D3CBD4;border-radius:8px;background:#FFFFFF;padding:40px;text-align:center;min-height:320px;box-sizing:border-box}
.empty h2{margin:0;font-size:17px;font-weight:600;color:#2E2430}
.empty p{margin:0;max-width:440px;font-size:14px;line-height:1.5;color:#666664}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#666664;text-decoration:none;align-self:flex-start}
.note{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px dashed #7C7C7A;border-radius:8px;background:#FAF7F4;font-size:13px;color:#2E2430}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:#2E2430;text-transform:none;letter-spacing:0;font-weight:400}
.ck input{width:16px;height:16px;margin:0}
.nv{position:relative;display:flex;align-items:stretch}
.dd{display:none;position:absolute;top:100%;left:0;min-width:230px;background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.10);padding:6px;z-index:60;flex-direction:column;gap:2px}
.nv:hover .dd,.nv:focus-within .dd,.nv.open .dd{display:flex}
.dd a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;font-size:13.5px;font-weight:400;color:#2E2430;text-decoration:none;border-radius:4px}
.dd a:hover{background:#EFE9F0}
.dd a small{font-size:11.5px;color:#666664}
.dd .who{padding:8px 10px 10px;border-bottom:1px solid #E6E2DE;margin-bottom:4px;font-size:12.5px;color:#666664}
.dd .who b{display:block;font-size:13.5px;color:#2E2430}
</style>
<link rel="stylesheet" href="assets/ledger.css">
</head>
<body>
<script type="text/x-template" id="ledger-tpl">
<div style="width: 100%;min-height: 100vh;box-sizing: border-box;display: flex;flex-direction: column;background: #FAF7F4;font-family: 'Lato', system-ui, sans-serif;color: #2E2430">

  <header style="height: 56px;flex-shrink: 0;display: flex;align-items: center;justify-content: space-between;padding: 0 24px;background: #FFFFFF;border-bottom: 1px solid #E6E2DE;position: relative;z-index: 55">
    <div style="display: flex;align-items: center;gap: 12px">
      <img class="brand-logo" src="assets/logo.svg" alt="Sai Seva Sangh" width="36" height="36">
      <span style="display: flex;flex-direction: column;line-height: 1.1"><span style="font-size: 18px;font-weight: 700;letter-spacing: 0.01em">Ledger</span><span class="brand-sub">sai seva sangh</span></span><span style="font-size: 11px;font-weight: 600;letter-spacing: 0.08em;text-transform: uppercase;color: #FFFFFF;background: #2E2430;border-radius: 4px;padding: 2px 6px">Admin</span>
    </div>
    <div class="nv"><button aria-label="Profile menu – [Admin name]" aria-haspopup="true" style="width: 36px;height: 36px;border-radius: 50%;border: 1.5px solid #7C7C7A;background: #2E2430;color: #FFFFFF;font: 600 14px 'Lato', sans-serif;cursor: pointer;padding: 0">A</button><div class="dd" role="menu" style="left: auto;right: 0;top: 44px"><div class="who"><b>[Admin name]</b>School admin</div><a href="AdminMyAccount.html">My Account</a><a href="Login.html">Log out</a></div></div>
  </header>

  <nav aria-label="Primary" style="height: 46px;flex-shrink: 0;display: flex;align-items: stretch;gap: 8px;padding: 0 24px;background: #FFFFFF;border-bottom: 1px solid #E6E2DE;position: relative;z-index: 50">
    <a href="AdminDashboard.html" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Dashboard</a>
    <a href="AdminEnrollment.html" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Student Enrollment</a>
    <a href="AdminSearchStart.html" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Student Search</a>
    <a href="AdminAllClassesStart.html" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">All Classes</a>
    <div class="nv"><a href="AdminPastYears.html" aria-haspopup="true" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Past Records<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a><div class="dd" role="menu"><a href="AdminPastYears.html">Past Academic Years</a><a href="AdminFormerStudents.html">Former Students</a><a href="AdminReports.html">Reports</a></div></div>
    <div class="nv"><a href="AdminTimetable.html" aria-haspopup="true" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Scheduling<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a><div class="dd" role="menu"><a href="AdminTimetable.html">Timetable</a><a href="AdminTerms.html">Terms and Periods</a><a href="AdminRooms.html">Rooms</a></div></div>
    <div class="nv"><a href="AdminStaff.html" aria-current="page" aria-haspopup="true" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;font-weight: 600;color: #2E2430;text-decoration: none;border-bottom: 3px solid #6E5A70">Permissions<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a><div class="dd" role="menu"><a href="AdminStaff.html">Staff Directory</a><a href="AdminRoles.html">Roles and Permissions</a><a href="AdminSettings.html">School Settings</a></div></div>
  </nav>

  <main style="flex: 1;min-height: 0;padding: 28px 40px;box-sizing: border-box;display: flex;flex-direction: column;gap: 18px">
      <div style="display: flex;justify-content: space-between;align-items: flex-end;gap: 24px">
        <div style="display: flex;flex-direction: column;gap: 6px">
          <h1 style="margin: 0;font-size: 24px;font-weight: 600;color: #2E2430">Staff Directory</h1>
          <p style="margin: 0;font-size: 14px;color: #666664">Teachers and admins, their roles and assigned classes.</p>
        </div>
        <div style="display: flex;gap: 10px;flex-shrink: 0"><button type="button" class="btn">Export</button><button type="button" class="btn p"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Invite Staff</button></div>
      </div>
      <nav aria-label="Views" class="tabs"><a class="tab on" href="#" aria-current="page">All <span>4</span></a><a class="tab" href="#">Teachers <span>3</span></a><a class="tab" href="#">Admins <span>1</span></a></nav>
      <div style="display: flex;justify-content: space-between;align-items: flex-end;gap: 12px;flex-wrap: wrap"><label style="display: flex;align-items: center;gap: 8px;width: 360px;height: 38px;padding: 0 12px;box-sizing: border-box;border: 1px solid #7C7C7A;border-radius: 4px;background: #FFFFFF;color: #666664"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input aria-label="Search staff by name or email" placeholder="Search staff by name or email" style="border: none;outline: none;flex: 1;min-width: 0;font: 400 14px 'Lato', sans-serif;background: transparent"></label><label class="fl" style="width: 160px">Status<select class="in"><option>All</option><option>Active</option><option>Invited</option><option>Inactive</option></select></label></div>
      <sc-if value="{{full}}" hint-placeholder-val="{{ true }}"><div class="tbx"><table class="tt"><thead><tr><th scope="col">Name</th><th scope="col">Role</th><th scope="col">Classes</th><th scope="col">Email</th><th scope="col">Status</th><th scope="col"></th></tr></thead><tbody>
            <tr><th scope="row"><a href="#" style="color: #2E2430;text-underline-offset: 3px">Ms. Vineetha</a></th><td>Teacher · Class teacher</td><td>Grade 6 – Mathematics; ★ Grade 6</td><td>[email]</td><td><span class="tag">Active</span></td><td><button type="button" class="btn s">View</button></td></tr>
            <tr><th scope="row"><a href="#" style="color: #2E2430;text-underline-offset: 3px">Shakeera</a></th><td>Admin</td><td>—</td><td>[email]</td><td><span class="tag">Active</span></td><td><button type="button" class="btn s">View</button></td></tr>
            <tr><th scope="row"><a href="#" style="color: #2E2430;text-underline-offset: 3px">[Teacher name]</a></th><td>Teacher</td><td>Grade 6 – Physical Science</td><td>[email]</td><td><span class="tag">Active</span></td><td><button type="button" class="btn s">View</button></td></tr>
            <tr><th scope="row"><a href="#" style="color: #2E2430;text-underline-offset: 3px">[Teacher name]</a></th><td>Teacher</td><td>—</td><td>[email]</td><td><span class="tag dash">Invited</span></td><td><button type="button" class="btn s">Resend</button></td></tr>
            </tbody></table></div></sc-if>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><section class="empty" aria-label="Empty state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#7C7C7A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.6 3.5 6"></path></svg><h2>No staff yet</h2><p>Invite teachers and admins to give them access to Ledger.</p><button type="button" class="btn p"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Invite Staff</button></section></sc-if>
    </main>
</div>
</script>
<div id="ledger-root"></div>
<script src="assets/ledger.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const e = this.props.emptyState ?? false;
    return { empty: !!e, full: !e };
  }
}
Ledger.mount(Component, Ledger.propsFrom({"emptyState": {"editor": "boolean", "default": false}, "$preview": {"width": 1512, "height": 982}}));
</script>
</body>
</html>
