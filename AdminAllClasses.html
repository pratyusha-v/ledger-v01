<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Admin – Classes &amp; Grades</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E2430}a:hover{color:#2E2430}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;color:#2E2430}
.tbl th,.tbl td{border-bottom:1px solid #E6E2DE;border-right:1px solid #E6E2DE;padding:0 12px;background:#FFFFFF;white-space:nowrap}
.tbl thead th{background:#FAF7F4;border-bottom:2px solid #7C7C7A;padding:10px 12px;text-align:right;font-weight:600;font-size:13px;vertical-align:top}
.tbl td{height:48px;text-align:right}
.tbl .name{text-align:left;width:200px;min-width:200px;border-right:2px solid #7C7C7A;font-weight:500}
.tbl .sum{background:#EFE9F0}
.tbl thead .sum{background:#EFE9F0}
.sub{font-size:11.5px;font-weight:400;color:#666664;margin-top:3px}
.sk{display:inline-block;height:10px;width:28px;background:#EFE9F0;border-radius:4px}
.grp{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#666664;padding:14px 10px 6px}
.cl{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;font-size:13.5px;color:#2E2430;text-decoration:none;border-left:3px solid transparent}
.cl:hover{background:#FAF7F4}
.cl.on{background:#EFE9F0;border-left-color:#6E5A70;font-weight:600;color:#2E2430}
.cl small{font-size:11.5px;color:#666664;font-weight:400}
.nv{position:relative;display:flex;align-items:stretch}
.dd{display:none;position:absolute;top:100%;left:0;min-width:230px;background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.10);padding:6px;z-index:60;flex-direction:column;gap:2px}
.nv:hover .dd,.nv:focus-within .dd,.nv.open .dd{display:flex}
.dd a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;font-size:13.5px;font-weight:400;color:#2E2430;text-decoration:none;border-radius:4px}
.dd a:hover{background:#EFE9F0}
.dd a small{font-size:11.5px;color:#666664}
.dd .who{padding:8px 10px 10px;border-bottom:1px solid #E6E2DE;margin-bottom:4px;font-size:12.5px;color:#666664}
.dd .who b{display:block;font-size:13.5px;color:#2E2430}
</style>
<link rel="stylesheet" href="assets/ledger.css">
</head>
<body>
<div style="width: 100%;min-height: 100vh;box-sizing: border-box;display: flex;flex-direction: column;background: #FAF7F4;font-family: 'Lato', system-ui, sans-serif;color: #2E2430">

  <!-- Shared header and navigation for every admin page. tools/build.py puts this in
     place of each wireframe's own header and nav; assets/nav.js marks the current
     section, fills the section links and breadcrumbs, and runs the search. The header
     and main nav stay pinned to the top while the page scrolls. -->
  <a class="skip" href="#main">Skip to content</a>
  <div class="site-top">
  <header class="site-head">
    <a class="site-brand" href="AdminDashboard.html" aria-label="Ledger admin home">
      <img class="brand-logo" src="assets/logo.svg" alt="" width="36" height="36">
      <span class="site-word"><span>Ledger</span><span class="brand-sub">sai seva sangh</span></span>
      <span class="site-badge">Admin</span>
    </a>
    <div class="gsearch" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="gsearch" type="search" placeholder="Search students, staff, classes" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="gsearch-list" aria-autocomplete="list" aria-label="Search students, staff and classes">
      <div id="gsearch-list" class="gsearch-list" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <div class="site-right">
      <button type="button" class="site-menu" aria-expanded="false" aria-controls="primary-nav">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu
      </button>
      <div class="nv"><button aria-label="Profile menu" aria-haspopup="true" class="site-avatar">A</button><div class="dd" role="menu" style="left: auto; right: 0; top: 44px"><div class="who"><b>Admin</b>School admin</div><a href="AdminSettings.html">School Settings</a><a href="AdminMyAccount.html">My Account</a><a href="Login.html">Log out</a></div></div>
    </div>
  </header>
  <nav aria-label="Primary" id="primary-nav" class="site-nav">
    <a data-section="dashboard" href="AdminDashboard.html">Dashboard</a>
    <a data-section="admissions" href="AdminAdmissions.html">Admissions</a>
    <a data-section="students" href="AdminSearchStart.html">Students</a>
    <a data-section="classes" href="AdminAllClassesStart.html">Classes &amp; Grades</a>
    <a data-section="timetable" href="AdminTimetable.html">Timetable</a>
    <a data-section="staff" href="AdminStaff.html">Staff</a>
    <a data-section="archive" href="AdminPastYears.html">Archive</a>
  </nav>
  </div>
  <nav aria-label="Section" class="site-sub" hidden></nav>

  <div style="flex: 1;display: flex;min-height: 0">
    <aside aria-label="All classes" style="width: 260px;flex-shrink: 0;background: #FFFFFF;border-right: 1px solid #E6E2DE;padding: 20px 12px;box-sizing: border-box;display: flex;flex-direction: column;gap: 2px;overflow: hidden"></aside>

    <main id="main" style="flex: 1;min-width: 0;padding: 28px 32px;box-sizing: border-box;display: flex;flex-direction: column;gap: 18px"><div class="app-loading" role="status">Loading…</div></main>
  </div>
</div>
<script type="module" src="assets/app.js"></script>

</html>
