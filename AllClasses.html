body{margin:0}
a{color:#2E2430}a:hover{color:#2E2430}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;color:#2E2430}
.tbl th,.tbl td{border-bottom:1px solid #E6E2DE;border-right:1px solid #E6E2DE;padding:0 12px;background:#FFFFFF;white-space:nowrap}
.tbl thead th{background:#FAF7F4;border-bottom:2px solid #7C7C7A;padding:10px 12px;text-align:right;font-weight:600;font-size:13px;vertical-align:top}
.tbl td{height:48px;text-align:right}
.tbl .name{text-align:left;width:200px;min-width:200px;border-right:2px solid #7C7C7A;font-weight:500}
.tbl .sum{background:#EFE9F0}

.sub{font-size:11.5px;font-weight:400;color:#666664;margin-top:3px}
.sk{display:inline-block;height:10px;width:28px;background:#EFE9F0;border-radius:4px}
.grp{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#666664;padding:14px 10px 6px}
.cl{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;font-size:13.5px;color:#2E2430;text-decoration:none;border-left:3px solid transparent}
.cl:hover{background:#FAF7F4}
.cl.on{background:#EFE9F0;border-left-color:#6E5A70;font-weight:600;color:#2E2430}
.cl small{font-size:11.5px;color:#666664;font-weight:400}
.nv{position:relative;display:flex;align-items:stretch}
.dd{display:none;position:absolute;top:100%;left:0;min-width:230px;background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.10);padding:6px;z-index:60;flex-direction:column;gap:2px}
.nv:hover .dd,.nv:focus-within .dd,.nv.open .dd{display:flex}
.dd a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;font-size:13.5px;font-weight:400;color:#2E2430;text-decoration:none;border-radius:4px}
.dd a:hover{background:#EFE9F0}
.dd a small{font-size:11.5px;color:#666664}
.dd .who{padding:8px 10px 10px;border-bottom:1px solid #E6E2DE;margin-bottom:4px;font-size:12.5px;color:#666664}
.dd .who b{display:block;font-size:13.5px;color:#2E2430}
