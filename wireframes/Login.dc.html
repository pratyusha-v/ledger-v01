<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger – Sign In</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#333}a:hover{color:#000}
.card{background:#ffffff;border:1px solid #c8c8c8;border-radius:4px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;min-width:0}
.sh{margin:0;font-size:15px;font-weight:600;color:#111111;padding-bottom:10px;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sh small{font-size:12.5px;font-weight:400;color:#5c5c5c}
.tt{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px;color:#1f1f1f}
.tt th,.tt td{border-bottom:1px solid #e0e0e0;padding:0 14px;background:#ffffff;text-align:left;white-space:nowrap;height:50px}
.tt thead th{background:#f4f4f4;border-bottom:2px solid #9a9a9a;height:42px;font-size:13px;font-weight:600}
.tt tbody th{font-weight:500}
.tt .num{text-align:right}
.tbx{border:1px solid #c8c8c8;background:#ffffff;border-radius:4px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;box-sizing:border-box;border:1.5px solid #555555;border-radius:4px;background:#ffffff;color:#1f1f1f;font:500 14px 'IBM Plex Sans',sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f0f0f0;color:#111111}
.btn.p{background:#222222;border-color:#222222;color:#ffffff}
.btn.p:hover{background:#000000;color:#ffffff}
.btn.s{height:32px;padding:0 12px;font-size:13px}
.btn.ghost{border-color:#c8c8c8;color:#8a8a8a;cursor:not-allowed}
.fl{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:#5c5c5c;min-width:0}
.in{box-sizing:border-box;width:100%;height:38px;border:1px solid #9a9a9a;border-radius:3px;padding:0 10px;font:400 14px 'IBM Plex Sans',sans-serif;background:#ffffff;color:#1f1f1f;text-transform:none;letter-spacing:0}
.in::placeholder,.ta::placeholder{color:#767676;font-style:italic}
.in:focus,.ta:focus{outline:2px solid #333333;outline-offset:-1px}
.ta{box-sizing:border-box;width:100%;border:1px solid #9a9a9a;border-radius:3px;padding:8px 10px;font:400 14px/1.45 'IBM Plex Sans',sans-serif;background:#ffffff;color:#1f1f1f;resize:vertical;text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px}
.tabs{display:flex;gap:24px;border-bottom:1px solid #d6d6d6}
.tab{display:flex;align-items:center;gap:6px;padding:0 4px;height:38px;font-size:14px;text-decoration:none;border-bottom:3px solid transparent;color:#555555}
.tab.on{color:#111111;font-weight:600;border-bottom-color:#222222}
.tab span{font-size:12px;color:#5c5c5c;background:#ededed;border-radius:9px;padding:0 7px;font-weight:500}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:3px;border:1px solid #9a9a9a;color:#333333;background:#f6f6f6;white-space:nowrap}
.tag.dk{background:#333333;color:#ffffff;border-color:#333333}
.tag.dash{border-style:dashed;color:#555555;background:#ffffff}
.stat{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid #d6d6d6;border-radius:4px;background:#ffffff;min-width:0}
.stat b{font-size:26px;font-weight:600;color:#111111;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:#5c5c5c}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:0}
.kv div{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv dt{font-size:11.5px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:#5c5c5c}
.kv dd{margin:0;font-size:14px;color:#1a1a1a}
.ph{color:#767676;font-style:italic}
.sk{display:inline-block;height:10px;background:#e3e3e3;border-radius:2px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:1.5px dashed #b5b5b5;border-radius:4px;background:#ffffff;padding:40px;text-align:center;min-height:320px;box-sizing:border-box}
.empty h2{margin:0;font-size:17px;font-weight:600;color:#222222}
.empty p{margin:0;max-width:440px;font-size:14px;line-height:1.5;color:#555555}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#444444;text-decoration:none;align-self:flex-start}
.note{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px dashed #8a8a8a;border-radius:4px;background:#f2f2f2;font-size:13px;color:#333333}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:#1f1f1f;text-transform:none;letter-spacing:0;font-weight:400}
.ck input{width:16px;height:16px;margin:0}
.nv{position:relative;display:flex;align-items:stretch}
.dd{display:none;position:absolute;top:100%;left:0;min-width:230px;background:#ffffff;border:1px solid #c8c8c8;border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,0.10);padding:6px;z-index:60;flex-direction:column;gap:2px}
.nv:hover .dd,.nv:focus-within .dd,.nv.open .dd{display:flex}
.dd a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;font-size:13.5px;font-weight:400;color:#222222;text-decoration:none;border-radius:3px}
.dd a:hover{background:#efefef}
.dd a small{font-size:11.5px;color:#767676}
.dd .who{padding:8px 10px 10px;border-bottom:1px solid #e3e3e3;margin-bottom:4px;font-size:12.5px;color:#555555}
.dd .who b{display:block;font-size:13.5px;color:#111111}
</style>
</helmet>
<div style="width: 1512px; height: 982px; box-sizing: border-box; display: flex; flex-direction: column; background: #fafafa; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1f1f1f; overflow: hidden">

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; background: #f2f2f2">
    <section class="card" style="width: 420px; padding: 32px; gap: 18px">
      <div style="display: flex; align-items: center; gap: 12px"><div style="width: 40px; height: 40px; border: 1.5px dashed #8a8a8a; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #5c5c5c; background: #f2f2f2">LOGO</div><span style="font-size: 22px; font-weight: 700">Ledger</span></div>
      <div><h1 style="margin: 0 0 4px; font-size: 22px; font-weight: 600">Sign in</h1><p style="margin: 0; font-size: 14px; color: #555555">Teachers and school admins use the same sign-in.</p></div>
      <label class="fl">Email or phone<input class="in" type="text" placeholder="name@example.com"></label>
      <label class="fl">Password<input class="in" type="password" placeholder="Your password"></label>
      <div style="display: flex; justify-content: space-between; align-items: center"><label class="ck" style="font-size: 13.5px"><input type="checkbox"> Keep me signed in</label><a href="ForgotPassword.dc.html" style="font-size: 13.5px">Forgot password?</a></div>
      <a class="btn p" href="Dashboard.dc.html" style="width: 100%">Sign In</a>
      <p class="ph" style="margin: 0; font-size: 12.5px; text-align: center">Your role (teacher or admin) decides what you see after signing in.</p>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1512, "height": 982}}'>
class Component extends DCLogic {
  renderVals() {
    return {  };
  }
}
</script>
</body>
</html>
