<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Admin – Test Details</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E2430}a:hover{color:#2E2430}
.card{background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;min-width:0}
.sh{margin:0;font-size:15px;font-weight:600;color:#2E2430;padding-bottom:10px;border-bottom:1px solid #E6E2DE}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:0}
.kv div{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv dt{font-size:11.5px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:#666664}
.kv dd{margin:0;font-size:14px;color:#2E2430}
.ph{color:#666664;font-style:italic}
.stat{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid #E6E2DE;border-radius:8px;background:#FAF7F4}
.stat b{font-size:26px;font-weight:600;color:#2E2430;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:#666664}
.tt{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px;color:#2E2430}
.tt th,.tt td{border-bottom:1px solid #E6E2DE;padding:0 14px;background:#FFFFFF;text-align:left;white-space:nowrap;height:46px}
.tt thead th{background:#FAF7F4;border-bottom:2px solid #7C7C7A;height:40px;font-size:13px;font-weight:600}
.tt tbody th{font-weight:500}
.tt .num{text-align:right}
.ab{display:inline-block;font-style:italic;color:#666664;background:#FAF7F4;border:1px dashed #D3CBD4;border-radius:4px;padding:1px 6px;font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid #7C7C7A;color:#2E2430;background:#FAF7F4;margin-left:8px}
.nv{position:relative;display:flex;align-items:stretch}
.dd{display:none;position:absolute;top:100%;left:0;min-width:230px;background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.10);padding:6px;z-index:60;flex-direction:column;gap:2px}
.nv:hover .dd,.nv:focus-within .dd,.nv.open .dd{display:flex}
.dd a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;font-size:13.5px;font-weight:400;color:#2E2430;text-decoration:none;border-radius:4px}
.dd a:hover{background:#EFE9F0}
.dd a small{font-size:11.5px;color:#666664}
.dd .who{padding:8px 10px 10px;border-bottom:1px solid #E6E2DE;margin-bottom:4px;font-size:12.5px;color:#666664}
.dd .who b{display:block;font-size:13.5px;color:#2E2430}
</style>
<link rel="stylesheet" href="assets/ledger.css">
</head>
<body>
<div style="width: 100%;min-height: 100vh;box-sizing: border-box;display: flex;flex-direction: column;background: #FAF7F4;font-family: 'Lato', system-ui, sans-serif;color: #2E2430">

  <header style="height: 56px;flex-shrink: 0;display: flex;align-items: center;justify-content: space-between;padding: 0 24px;background: #FFFFFF;border-bottom: 1px solid #E6E2DE;position: relative;z-index: 55">
    <div style="display: flex;align-items: center;gap: 12px">
      <img class="brand-logo" src="assets/logo.svg" alt="Sai Seva Sangh" width="36" height="36">
      <span style="display: flex;flex-direction: column;line-height: 1.1"><span style="font-size: 18px;font-weight: 700;letter-spacing: 0.01em">Ledger</span><span class="brand-sub">sai seva sangh</span></span><span style="font-size: 11px;font-weight: 600;letter-spacing: 0.08em;text-transform: uppercase;color: #FFFFFF;background: #2E2430;border-radius: 4px;padding: 2px 6px">Admin</span>
    </div>
    <div class="nv"><button aria-label="Profile menu – [Admin name]" aria-haspopup="true" style="width: 36px;height: 36px;border-radius: 50%;border: 1.5px solid #7C7C7A;background: #2E2430;color: #FFFFFF;font: 600 14px 'Lato', sans-serif;cursor: pointer;padding: 0">A</button><div class="dd" role="menu" style="left: auto;right: 0;top: 44px"><div class="who"><b>[Admin name]</b>School admin</div><a href="AdminMyAccount.html">My Account</a><a href="Login.html">Log out</a></div></div>
  </header>

  <nav aria-label="Primary" style="height: 46px;flex-shrink: 0;display: flex;align-items: stretch;gap: 8px;padding: 0 24px;background: #FFFFFF;border-bottom: 1px solid #E6E2DE;position: relative;z-index: 50">
    <a href="AdminDashboard.html" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Dashboard</a>
    <a href="AdminEnrollment.html" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Student Enrollment</a>
    <a href="AdminSearchStart.html" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Student Search</a>
    <a href="AdminAllClassesStart.html" aria-current="page" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;font-weight: 600;color: #2E2430;text-decoration: none;border-bottom: 3px solid #6E5A70">All Classes</a>
    <div class="nv"><a href="AdminPastYears.html" aria-haspopup="true" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Past Records<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a><div class="dd" role="menu"><a href="AdminPastYears.html">Past Academic Years</a><a href="AdminFormerStudents.html">Former Students</a><a href="AdminReports.html">Reports</a></div></div>
    <div class="nv"><a href="AdminTimetable.html" aria-haspopup="true" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Scheduling<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a><div class="dd" role="menu"><a href="AdminTimetable.html">Timetable</a><a href="AdminTerms.html">Terms and Periods</a><a href="AdminRooms.html">Rooms</a></div></div>
    <div class="nv"><a href="AdminStaff.html" aria-haspopup="true" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Permissions<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a><div class="dd" role="menu"><a href="AdminStaff.html">Staff Directory</a><a href="AdminRoles.html">Roles and Permissions</a><a href="AdminSettings.html">School Settings</a></div></div>
  </nav>

  <div style="flex: 1;display: flex;min-height: 0">
    <aside aria-label="Find a class" style="width: 232px;flex-shrink: 0;background: #FFFFFF;border-right: 1px solid #E6E2DE;padding: 20px 14px;box-sizing: border-box;display: flex;flex-direction: column;gap: 14px"></aside>

    <main style="flex: 1;min-width: 0;padding: 22px 32px 28px;box-sizing: border-box;display: flex;flex-direction: column;gap: 16px"><div class="app-loading" role="status">Loading…</div></main>
  </div>
</div>
