<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger – Attendance</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E2430}a:hover{color:#2E2430}
.tt{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px;color:#2E2430}
.tt th,.tt td{border-bottom:1px solid #E6E2DE;padding:0 14px;background:#FFFFFF;text-align:left;white-space:nowrap}
.tt thead th{background:#FAF7F4;border-bottom:2px solid #7C7C7A;height:42px;font-size:13px;font-weight:600}
.tt td,.tt tbody th{height:56px}
.tt tbody th{font-weight:500}
.tt .num{text-align:right}
.seg{display:inline-flex;border:1.5px solid #7C7C7A;border-radius:8px;overflow:hidden}
.seg button{height:32px;min-width:44px;padding:0 12px;border:none;border-right:1px solid #7C7C7A;background:#FFFFFF;color:#2E2430;font:500 13px 'Lato',sans-serif;cursor:pointer}
.seg button:last-child{border-right:none}
.seg button[aria-pressed=true]{background:#FF911E;color:#2E2430}
.in{width:100%;box-sizing:border-box;height:34px;border:1px solid #E6E2DE;border-radius:4px;padding:0 10px;font:400 13px 'Lato',sans-serif;background:#FAF7F4}
.in::placeholder{color:#666664;font-style:italic}
.tab{display:flex;align-items:center;padding:0 4px;height:38px;font-size:14px;text-decoration:none;border-bottom:3px solid transparent;color:#666664}
.tab.on{color:#2E2430;font-weight:600;border-bottom-color:#6E5A70}
.stat{display:flex;flex-direction:column;gap:2px;padding:0 20px;border-left:1px solid #E6E2DE}
.stat b{font-size:20px;font-weight:600;color:#2E2430}
.stat span{font-size:12px;color:#666664}
.nv{position:relative;display:flex;align-items:stretch}
.dd{display:none;position:absolute;top:100%;left:0;min-width:230px;background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.10);padding:6px;z-index:60;flex-direction:column;gap:2px}
.nv:hover .dd,.nv:focus-within .dd,.nv.open .dd{display:flex}
.dd a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;font-size:13.5px;font-weight:400;color:#2E2430;text-decoration:none;border-radius:4px}
.dd a:hover{background:#EFE9F0}
.dd a small{font-size:11.5px;color:#666664}
.dd .who{padding:8px 10px 10px;border-bottom:1px solid #E6E2DE;margin-bottom:4px;font-size:12.5px;color:#666664}
.dd .who b{display:block;font-size:13.5px;color:#2E2430}
</style>
<link rel="stylesheet" href="assets/ledger.css">
</head>
<body>
<div style="width: 100%;min-height: 100vh;box-sizing: border-box;display: flex;flex-direction: column;background: #FAF7F4;font-family: 'Lato', system-ui, sans-serif;color: #2E2430">

  <!-- Shared header and navigation for every teacher page. tools/build.py puts this in
     place of each wireframe's own header and nav; assets/nav.js marks the current
     section, fills the section links and breadcrumbs, and runs the search. The header
     and main nav stay pinned to the top while the page scrolls. -->
  <a class="skip" href="#main">Skip to content</a>
  <div class="site-top">
  <header class="site-head">
    <a class="site-brand" href="Dashboard.html" aria-label="Ledger home">
      <img class="brand-logo" src="assets/logo.svg" alt="" width="36" height="36">
      <span class="site-word"><span>Ledger</span><span class="brand-sub">sai seva sangh</span></span>
    </a>
    <div class="gsearch" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="gsearch" type="search" placeholder="Search students and classes" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="gsearch-list" aria-autocomplete="list" aria-label="Search students and classes">
      <div id="gsearch-list" class="gsearch-list" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <div class="site-right">
      <button type="button" class="site-menu" aria-expanded="false" aria-controls="primary-nav">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu
      </button>
      <div class="nv"><button aria-label="Profile menu" aria-haspopup="true" class="site-avatar">T</button><div class="dd" role="menu" style="left: auto; right: 0; top: 44px"><div class="who"><b>Teacher</b>Teacher</div><a href="MyAccount.html">My Account</a><a href="Login.html">Log out</a></div></div>
    </div>
  </header>
  <nav aria-label="Primary" id="primary-nav" class="site-nav">
    <a data-section="dashboard" href="Dashboard.html">Dashboard</a>
    <a data-section="classes" href="Main.html">My Classes</a>
    <a data-section="all" href="AllClassesStart.html">All Classes</a>
    <a data-section="students" href="SearchStart.html">Students</a>
  </nav>
  </div>
  <nav aria-label="Section" class="site-sub" hidden></nav>

  <div style="flex: 1;display: flex;min-height: 0">
    <aside aria-label="My classes" style="width: 232px;flex-shrink: 0;background: #FFFFFF;border-right: 1px solid #E6E2DE;padding: 20px 12px;box-sizing: border-box;display: flex;flex-direction: column;gap: 4px"></aside>

    <main id="main" style="flex: 1;min-width: 0;padding: 28px 32px;box-sizing: border-box;display: flex;flex-direction: column;gap: 18px"><div class="app-loading" role="status">Loading…</div></main>
  </div>
</div>
<script type="module" src="assets/app.js"></script>
<script type="text/javascript" src="https://api.useberry.com/integrations/liveUrl/scripts/useberryScript.js"></script>
</body>
</html>
