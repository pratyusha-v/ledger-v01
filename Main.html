<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger – Gradebook</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E2430}a:hover{color:#2E2430}
.tbl{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px;color:#2E2430}
.tbl th,.tbl td{border-bottom:1px solid #E6E2DE;border-right:1px solid #E6E2DE;padding:0 12px;background:#FFFFFF;white-space:nowrap}
.tbl thead th{background:#FAF7F4;border-bottom:2px solid #7C7C7A;vertical-align:top;padding:10px 12px;text-align:right;font-weight:600}
.tbl td{height:48px;text-align:right}
.tbl .name{position:sticky;left:0;z-index:2;text-align:left;width:200px;min-width:200px;border-right:2px solid #7C7C7A;font-weight:500}
.tbl thead .name{z-index:4;vertical-align:bottom}
.tbl .ev{min-width:96px}
.tbl .gap{background:#FFFFFF;border:none;min-width:12px;width:12px;padding:0}
.tbl thead .gap{background:#FFFFFF;border-bottom:none}
.tbl .sum{background:#EFE9F0;min-width:132px;border-right:1px solid #E6E2DE}
.tbl thead .sum{background:#EFE9F0}
.tbl .sum.first{border-left:2px solid #7C7C7A}
.hrow{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:13px;color:#2E2430}
.evl{color:#2E2430;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#666664}
.evl:hover{text-decoration-color:#2E2430}
.sub{font-size:11.5px;font-weight:400;color:#666664;margin-top:3px}
.dt{font-size:11.5px;font-weight:500;color:#2E2430;margin-top:4px}
.info{position:relative;display:inline-flex}
.info button{width:18px;height:18px;border-radius:50%;border:1.5px solid #7C7C7A;background:#FFFFFF;color:#2E2430;font:600 11px/1 'Lato',sans-serif;font-style:italic;padding:0;cursor:help;display:inline-flex;align-items:center;justify-content:center}
.info button:hover,.info button:focus{background:#2E2430;color:#FFFFFF;border-color:#7C7C7A;outline:none}
.tip{display:none;position:absolute;top:26px;left:auto;right:-8px;background:#2E2430;color:#FFFFFF;font-size:12px;font-weight:400;font-style:normal;line-height:1.45;padding:7px 10px;border-radius:8px;white-space:normal;width:270px;z-index:10;text-align:left}
.info:hover .tip,.info:focus-within .tip{display:block}
.ab{display:inline-block;font-style:italic;color:#666664;background:#FAF7F4;border:1px dashed #D3CBD4;border-radius:4px;padding:1px 6px;font-size:12.5px}
.pct{display:block;font-size:12px;color:#666664;margin-top:1px}
.big{font-weight:600}
.nm{color:#2E2430;text-decoration:underline;text-underline-offset:3px}
.stat{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid #E6E2DE;border-radius:8px;background:#FFFFFF}
.stat b{font-size:26px;font-weight:600;color:#2E2430;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:#666664}
.nv{position:relative;display:flex;align-items:stretch}
.dd{display:none;position:absolute;top:100%;left:0;min-width:230px;background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.10);padding:6px;z-index:60;flex-direction:column;gap:2px}
.nv:hover .dd,.nv:focus-within .dd,.nv.open .dd{display:flex}
.dd a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;font-size:13.5px;font-weight:400;color:#2E2430;text-decoration:none;border-radius:4px}
.dd a:hover{background:#EFE9F0}
.dd a small{font-size:11.5px;color:#666664}
.dd .who{padding:8px 10px 10px;border-bottom:1px solid #E6E2DE;margin-bottom:4px;font-size:12.5px;color:#666664}
.dd .who b{display:block;font-size:13.5px;color:#2E2430}
</style>
<link rel="stylesheet" href="assets/ledger.css">
</head>
<body>
<div style="width: 100%;min-height: 100vh;box-sizing: border-box;display: flex;flex-direction: column;background: #FAF7F4;font-family: 'Lato', system-ui, sans-serif;color: #2E2430">

  <!-- Top bar -->
  <header style="height: 56px;flex-shrink: 0;display: flex;align-items: center;justify-content: space-between;padding: 0 24px;background: #FFFFFF;border-bottom: 1px solid #E6E2DE;position: relative;z-index: 55">
    <div style="display: flex;align-items: center;gap: 12px">
      <img class="brand-logo" src="assets/logo.svg" alt="Sai Seva Sangh" width="36" height="36">
      <span style="display: flex;flex-direction: column;line-height: 1.1"><span style="font-size: 18px;font-weight: 700;letter-spacing: 0.01em">Ledger</span><span class="brand-sub">sai seva sangh</span></span>
    </div>
    <div class="nv"><button aria-label="Profile menu – Ms. Vineetha" aria-haspopup="true" style="width: 36px;height: 36px;border-radius: 50%;border: 1.5px solid #7C7C7A;background: #EFE9F0;color: #2E2430;font: 600 14px 'Lato', sans-serif;cursor: pointer;padding: 0">V</button><div class="dd" role="menu" style="left: auto;right: 0;top: 44px"><div class="who"><b>Ms. Vineetha</b>Teacher</div><a href="MyAccount.html">My Account</a><a href="Login.html">Log out</a></div></div>
  </header>

  <!-- Nav bar -->
  <nav aria-label="Primary" style="height: 46px;flex-shrink: 0;display: flex;align-items: stretch;gap: 8px;padding: 0 24px;background: #FFFFFF;border-bottom: 1px solid #E6E2DE;position: relative;z-index: 50">
    <a href="Dashboard.html" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Dashboard</a>
    <div class="nv"><a href="Main.html" aria-current="page" aria-haspopup="true" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;font-weight: 600;color: #2E2430;text-decoration: none;border-bottom: 3px solid #6E5A70">Classes<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a><div class="dd" role="menu"><a href="Main.html">My Classes</a><a href="AllClassesStart.html">All Classes</a></div></div>
    <a href="SearchStart.html" style="display: flex;align-items: center;gap: 6px;padding: 0 14px;font-size: 14px;color: #666664;text-decoration: none;border-bottom: 3px solid transparent">Students</a>
  </nav>

  <div style="flex: 1;display: flex;min-height: 0">

    <!-- Sidebar -->
    <aside aria-label="My classes" style="width: 232px;flex-shrink: 0;background: #FFFFFF;border-right: 1px solid #E6E2DE;padding: 20px 12px;box-sizing: border-box;display: flex;flex-direction: column;gap: 4px"></aside>

    <!-- Main content -->
    <main style="flex: 1;min-width: 0;padding: 28px 32px;box-sizing: border-box;display: flex;flex-direction: column;gap: 18px"><div class="app-loading" role="status">Loading…</div></main>
  </div>
</div>
<script type="module" src="assets/app.js"></script>
</body>
</html>
