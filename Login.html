<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger – Sign In</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E2430}a:hover{color:#2E2430}
.card{background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;min-width:0}
.sh{margin:0;font-size:15px;font-weight:600;color:#2E2430;padding-bottom:10px;border-bottom:1px solid #E6E2DE;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sh small{font-size:12.5px;font-weight:400;color:#666664}
.tt{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px;color:#2E2430}
.tt th,.tt td{border-bottom:1px solid #E6E2DE;padding:0 14px;background:#FFFFFF;text-align:left;white-space:nowrap;height:50px}
.tt thead th{background:#FAF7F4;border-bottom:2px solid #7C7C7A;height:42px;font-size:13px;font-weight:600}
.tt tbody th{font-weight:500}
.tt .num{text-align:right}
.tbx{border:1px solid #E6E2DE;background:#FFFFFF;border-radius:8px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;box-sizing:border-box;border:1.5px solid #7C7C7A;border-radius:8px;background:#FFFFFF;color:#2E2430;font:500 14px 'Lato',sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:#FAF7F4;color:#2E2430}
.btn.p{background:#FF911E;border-color:#FF911E;color:#2E2430}
.btn.p:hover{background:#FF911E;color:#2E2430}
.btn.s{height:32px;padding:0 12px;font-size:13px}
.btn.ghost{border-color:#E6E2DE;color:#666664;cursor:not-allowed}
.fl{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:#666664;min-width:0}
.in{box-sizing:border-box;width:100%;height:38px;border:1px solid #7C7C7A;border-radius:4px;padding:0 10px;font:400 14px 'Lato',sans-serif;background:#FFFFFF;color:#2E2430;text-transform:none;letter-spacing:0}
.in::placeholder,.ta::placeholder{color:#666664;font-style:italic}
.in:focus,.ta:focus{outline:2px solid #7C7C7A;outline-offset:-1px}
.ta{box-sizing:border-box;width:100%;border:1px solid #7C7C7A;border-radius:4px;padding:8px 10px;font:400 14px/1.45 'Lato',sans-serif;background:#FFFFFF;color:#2E2430;resize:vertical;text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px}
.tabs{display:flex;gap:24px;border-bottom:1px solid #E6E2DE}
.tab{display:flex;align-items:center;gap:6px;padding:0 4px;height:38px;font-size:14px;text-decoration:none;border-bottom:3px solid transparent;color:#666664}
.tab.on{color:#2E2430;font-weight:600;border-bottom-color:#6E5A70}
.tab span{font-size:12px;color:#666664;background:#EFE9F0;border-radius:9px;padding:0 7px;font-weight:500}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:4px;border:1px solid #7C7C7A;color:#2E2430;background:#FAF7F4;white-space:nowrap}
.tag.dk{background:#2E2430;color:#FFFFFF;border-color:#7C7C7A}
.tag.dash{border-style:dashed;color:#666664;background:#FFFFFF}
.stat{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid #E6E2DE;border-radius:8px;background:#FFFFFF;min-width:0}
.stat b{font-size:26px;font-weight:600;color:#2E2430;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:#666664}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:0}
.kv div{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv dt{font-size:11.5px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:#666664}
.kv dd{margin:0;font-size:14px;color:#2E2430}
.ph{color:#666664;font-style:italic}
.sk{display:inline-block;height:10px;background:#EFE9F0;border-radius:4px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:1.5px dashed #D3CBD4;border-radius:8px;background:#FFFFFF;padding:40px;text-align:center;min-height:320px;box-sizing:border-box}
.empty h2{margin:0;font-size:17px;font-weight:600;color:#2E2430}
.empty p{margin:0;max-width:440px;font-size:14px;line-height:1.5;color:#666664}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#666664;text-decoration:none;align-self:flex-start}
.note{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px dashed #7C7C7A;border-radius:8px;background:#FAF7F4;font-size:13px;color:#2E2430}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:#2E2430;text-transform:none;letter-spacing:0;font-weight:400}
.ck input{width:16px;height:16px;margin:0}
.nv{position:relative;display:flex;align-items:stretch}
.dd{display:none;position:absolute;top:100%;left:0;min-width:230px;background:#FFFFFF;border:1px solid #E6E2DE;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.10);padding:6px;z-index:60;flex-direction:column;gap:2px}
.nv:hover .dd,.nv:focus-within .dd,.nv.open .dd{display:flex}
.dd a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;font-size:13.5px;font-weight:400;color:#2E2430;text-decoration:none;border-radius:4px}
.dd a:hover{background:#EFE9F0}
.dd a small{font-size:11.5px;color:#666664}
.dd .who{padding:8px 10px 10px;border-bottom:1px solid #E6E2DE;margin-bottom:4px;font-size:12.5px;color:#666664}
.dd .who b{display:block;font-size:13.5px;color:#2E2430}
</style>
<link rel="stylesheet" href="assets/ledger.css">
</head>
<body>
<div style="width: 100%;min-height: 100vh;box-sizing: border-box;display: flex;flex-direction: column;background: #FAF7F4;font-family: 'Lato', system-ui, sans-serif;color: #2E2430">

  <main style="flex: 1;display: flex;align-items: center;justify-content: center;background: #FAF7F4">
    <section class="card" style="width: 420px;padding: 32px;gap: 18px">
      <div style="display: flex;align-items: center;gap: 12px"><img class="brand-logo" src="assets/logo.svg" alt="Sai Seva Sangh" width="40" height="40"><span style="display: flex;flex-direction: column;line-height: 1.1"><span style="font-size: 22px;font-weight: 700">Ledger</span><span class="brand-sub">sai seva sangh</span></span></div>
      <div><h1 style="margin: 0 0 4px;font-size: 22px;font-weight: 600">Sign in</h1><p style="margin: 0;font-size: 14px;color: #666664">Teachers and school admins use the same sign-in.</p></div>
      <label class="fl">Email or phone<input class="in" type="text" placeholder="name@example.com"></label>
      <label class="fl">Password<input class="in" type="password" placeholder="Your password"></label>
      <div style="display: flex;justify-content: space-between;align-items: center"><label class="ck" style="font-size: 13.5px"><input type="checkbox"> Keep me signed in</label><a href="ForgotPassword.html" style="font-size: 13.5px">Forgot password?</a></div>
      <a class="btn p" href="Dashboard.html" style="width: 100%">Sign In</a>
      <p class="ph" style="margin: 0;font-size: 12.5px;text-align: center">Your role (teacher or admin) decides what you see after signing in.</p>
    </section>
  </main>
</div>
<script type="module" src="assets/app.js"></script>
</body>
</html>
